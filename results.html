<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultaten pagina</title>

    <style>
        body {
            background-color: #e9eff6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 20px;
            margin: 0;
        }

        header {
            background: #1A3A5F;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            border-bottom: 4px solid #162F4D;
            width: 100%;
            box-sizing: border-box;
        }

        .container {
            margin-top: 100px;
            background-color: #F4F7FA;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 28px;
        }

        p {
            font-size: 18px;
            margin: 8px 0;
        }

        #score {
            font-size: 32px;
            font-weight: bold;
            color: #1A3A5F;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            background-color: #1A3A5F;
            cursor: pointer;
            transition: 0.2s;
            color: white;
        }

        button:hover {
            background-color: #162F4D;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <header>
        <h1>Quiz master</h1>
    </header>

    <div class="container">
        <h1>Je bent klaar met de quiz!</h1>
        <p>Je hebt de volgende score behaald:</p>
        <p id="score">0</p>
        <p id="totalText">van de 10 vragen goed</p>

        <div class="name-entry">
            <label for="playerName">Voer je naam in voor het leaderboard</label>
            <input type="text" id="playerName" placeholder="Jouw naam" />
        </div>

        <button id="saveBtn">Opslaan op leaderboard</button>
        <button onclick="window.location.href='quizanswer.html'">Opnieuw spelen</button>
    </div>

    <script>
    const score = parseInt(localStorage.getItem("quizScore") || '0', 10);
    const total = parseInt(localStorage.getItem("quizTotal") || '10', 10);
    const scoreElement = document.getElementById("score");
    const totalText = document.getElementById("totalText");
    const playerName = document.getElementById("playerName");
    const saveBtn = document.getElementById("saveBtn");

    scoreElement.textContent = score;
    totalText.textContent = `van de ${total} vragen goed`;

    saveBtn.addEventListener('click', () => {
        const name = playerName.value.trim();
        if (!name) {
            playerName.focus();
            playerName.placeholder = 'Voer eerst je naam in';
            return;
        }

        const existing = localStorage.getItem('quizLeaderboard');
        const leaderboard = existing ? JSON.parse(existing) : [];

        leaderboard.push({
            name, 
            score,
            total,
            date: new Date().toISOString()
        });

        leaderboard.sort((a, b) => b.score - a.score || new Date(a.date) - new Date(b.date));
        localStorage.setItem('quizLeaderboard', JSON.stringify(leaderboard));

        window.location.href = 'leaderboard.php';
    });
    </script>

</body>
</html>
